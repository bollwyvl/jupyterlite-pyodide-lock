name: pages

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  JLPL_PIXI_VERSION: &pixi_version 0.61.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.9.3
        with: { pixi-version: *pixi_version, cache: true, environments: build docs }
      - run: pixi run docs-lite
      - run: pixi run docs-sphinx
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
